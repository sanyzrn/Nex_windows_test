name: Desktop Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          # Desktop SDK used to validate the Windows golden baselines.
          # The upstream Android checkout pins its SDK independently.
          flutter-version: '3.44.8'
          cache: true

      # Default pub.dev hosts; a mirror is a supply-chain risk and is never
      # needed on GitHub-hosted runners. If this env block ever reappears,
      # fail the build.
      - name: Guard against package mirrors
        shell: pwsh
        run: ./tools/check_package_hosts.ps1

      - name: Install dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile

      # Rule 10: one version everywhere, enforced before anything builds.
      - name: Version consistency check
        working-directory: apps/desktop
        run: flutter test --no-pub test/version_consistency_test.dart

      # Item 13 / WP4: no colour literals, no hard-coded user-facing strings
      # in application code. The allowlist lives in tools/check_ui_hygiene.ps1
      # and every entry must carry a justification comment there.
      - name: UI hygiene check (no colour literals or hard-coded strings)
        working-directory: apps/desktop
        shell: pwsh
        run: ../../tools/check_ui_hygiene.ps1 -LibDir lib

      - name: Analyze code
        working-directory: apps/desktop
        run: flutter analyze --no-pub

      - name: Run tests (including goldens on Windows)
        working-directory: apps/desktop
        run: flutter test --no-pub

      - name: Test shared UI package
        working-directory: packages/ui
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze and test core and data packages
        shell: pwsh
        run: |
          foreach ($package in @('core', 'data')) {
            Push-Location "packages/$package"
            try {
              dart pub get --enforce-lockfile
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              dart analyze
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              dart test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }

      # The full suite above compares this matrix against the current app.
      - name: Upload reviewed screenshot matrix
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-screens
          path: apps/desktop/test/review_goldens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-golden-failures
          path: apps/desktop/test/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Windows release
        working-directory: apps/desktop
        run: flutter build windows --release --no-pub

      - name: Exercise native Windows release
        shell: pwsh
        run: ./apps/desktop/tools/windows_smoke.ps1 -Output "$env:RUNNER_TEMP/nex-windows-smoke.json"

      - name: Upload native smoke report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nex-native-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/nex-windows-smoke*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nex-windows-release-${{ github.sha }}
          path: apps/desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./apps/desktop/tools/install_inno_ci.ps1

      - name: Build Windows installer and checksums
        shell: pwsh
        run: |
          ./apps/desktop/tools/build_installer.ps1 -ISCC $env:INNO_ISCC
          $setup = Get-ChildItem -LiteralPath apps/desktop/build/installer/output -Filter 'Nex-Windows-Setup-*-x64.exe'
          if (@($setup).Count -ne 1) { throw 'Expected exactly one installer.' }
          $checksum = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($setup.Name)" | Set-Content -LiteralPath apps/desktop/build/installer/output/SHA256SUMS -Encoding ascii

      - name: Upload verified installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nex-windows-installer-${{ github.sha }}
          path: apps/desktop/build/installer/output/
          if-no-files-found: error
          retention-days: 30

      - name: Verify AI is removable (Rule 3)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          (Get-Content -LiteralPath pubspec.yaml) |
            Where-Object { $_ -notmatch '^  nex_ai:' -and $_ -notmatch '^    path: ../../packages/ai$' } |
            Set-Content -LiteralPath pubspec.yaml -Encoding utf8
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --exclude-tags golden
