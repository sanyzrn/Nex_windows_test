name: Publish tested Windows release

on:
  workflow_run:
    workflows: ['Desktop Windows CI']
    branches: [main, master]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to retry manually. New versions publish automatically after successful main-branch CI.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nex-windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # An older completed run is skipped before publication if main moved on.
      - name: Checkout trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, CI and installer then publish
        shell: pwsh
        run: ./apps/desktop/tools/publish_release.ps1
