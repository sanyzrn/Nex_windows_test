name: Feature request / پیشنهاد قابلیت
description: Describe a daily workflow that Nex could improve.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the current workflow and where it falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include a concrete example. Persian and English are welcome.
    validations:
      required: true
