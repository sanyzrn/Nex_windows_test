name: Bug report / گزارش باگ
description: Report a reproducible Windows app problem.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Nex version
      description: Find the version under Settings → About.
      placeholder: 0.22.0+16
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 25H2, build number from winver
    validations:
      required: true
  - type: input
    id: scaling
    attributes:
      label: Display scaling
      description: Include each monitor when scales differ.
      placeholder: 100% / 150%, two monitors
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [English, Persian, Both]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Interface mode
      options: [Window, Edge panel, Both]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the expected result and what actually happened. Persian and English are welcome.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostic details
      description: Remove private notes and clipboard content before sharing.
