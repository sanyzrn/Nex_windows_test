name: nex_desktop
description: "Nex for Windows desktop application."
publish_to: "none"
version: 0.38.0+31

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <4.0.0"

# No WebView, no wrapper: the whole UI is real Flutter/Dart.
dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart time zone database for the world clock (no native code involved).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  nex_core:
    path: ../../packages/core
  nex_data:
    path: ../../packages/data
  nex_ui:
    path: ../../packages/ui
  nex_ai:
    path: ../../packages/ai
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  crypto: ^3.0.6
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.9.4
  path: ^1.9.1
  record: ^6.1.1
  just_audio: ^0.10.0
  just_audio_windows: ^0.2.2
  timezone: ^0.10.1
  # Official FFI helpers (malloc/free) for the tiny user32 calls.
  ffi: ^2.1.0
  # PDFium is bundled at build time; reading never downloads a runtime.
  pdfrx: ">=2.4.0 <2.5.0"
  # image 4.11 (PDF backend) uses decodeLazy, absent in archive 4.3.
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app-logo.png
    - CHANGELOG.md
    - assets/CHANGELOG.fa.md
    - assets/notices/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/VazirmatnVariable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-subset.ttf
